name: Build and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate version tag
        run: |
          $config = Get-Content app/build.gradle.kts -Raw
          $match = [regex]::Match($config, 'versionName\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?)"')
          if (-not $match.Success) { throw 'Missing versionName.' }
          $version = $match.Groups[1].Value
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag must match app/build.gradle.kts versionName.' }
          if (-not (Test-Path -LiteralPath "docs/releases/v$version.md")) { throw 'Missing version release notes.' }
          "MYHOOK_VERSION=$version" >> $env:GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download verified Android build tools
        run: ./bootstrap-tools.ps1

      - name: Restore signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          foreach ($name in @('SIGNING_KEYSTORE_BASE64', 'SIGNING_STORE_PASSWORD', 'SIGNING_KEY_ALIAS', 'SIGNING_KEY_PASSWORD')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing GitHub Secret: $name" }
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'myhook-release.jks'
          [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:SIGNING_KEYSTORE_BASE64))

      - name: Build, test and verify signed APK
        env:
          MYHOOK_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          MYHOOK_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          MYHOOK_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          ./build.ps1 -Release -KeyStore (Join-Path $env:RUNNER_TEMP 'myhook-release.jks') -KeyAlias $env:MYHOOK_KEY_ALIAS -ExpectedCertificateSha256 '59d5bcb32b417c5bbb861e4b1a95f5f4ffeeb64d1dcbb49f40e531f456973084'

      - name: Remove temporary signing keystore
        if: always()
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP 'myhook-release.jks'
          if (Test-Path -LiteralPath $keyPath) { Remove-Item -LiteralPath $keyPath -Force }

      - name: Publish APK and SHA-256 to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = $env:MYHOOK_VERSION
          $apk = "dist/MyHook-$version.apk"
          $checksum = "$apk.sha256"
          if (-not (Test-Path -LiteralPath $apk) -or -not (Test-Path -LiteralPath $checksum)) { throw 'Release artifacts are missing.' }
          $releaseArgs = @('release', 'create', $env:GITHUB_REF_NAME, $apk, $checksum, '--verify-tag', '--title', "MyHook $version", '--notes-file', "docs/releases/v$version.md")
          if ($version.Contains('-')) { $releaseArgs += '--prerelease' }
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }
